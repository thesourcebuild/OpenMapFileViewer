# Sample custom classification rules for openmapfileviewer.
#
# This file mirrors the built-in defaults in src/analyzer/section_rules.py,
# but uses a user-friendly YAML shape that can be edited to add or extend
# section, memory-region, and module classification rules.

section_rules:
  keywords:
    code: [code, text, thumb, arm, function]
    rodata: [rodata, readonly, const, ro, ro-data]
    data: [rwdata, data, rw, rw-data]
    bss: [zidata, bss, zi, zero, zero-initialized]
    debug: [debug, debugdata]
  prefixes:
    code: [.text, .init, .fini, .isr_vector, .vectors, .itcm]
    rodata: [.rodata, .const, .ARM.extab, .ARM.exidx, .eh_frame, .gcc_except_table]
    data: [.data, .ramfunc, .fastcode, .dtcm]
    bss: [.bss, COMMON, .noinit, .heap, .stack, .dma_buffer]
    debug: [.debug, .stab, .line, .group, .comment, .note, .symtab, .strtab, .ARM.attributes, .xtensa.info, .gnu.attributes, .gnu.hash, .dynsym, .dynstr, .rel, .rela]
  suffixes:
    code: [.text, .text_end, .vectors, .force_slow]
    rodata: [.rodata, .literal, .appdesc]
    data: [.data, _reserved, .force_fast]
    bss: [.bss, .noload]

region_kind_rules:
  flash:
    keywords: [flash, rom, qspi, nor, nand, emmc, spi, boot, linear, program]
    attributes: [x, r]
  ram:
    keywords: [ram, sram, ddr, ocm, tcm, dram, bram, ps7_ram, ps7_ddr, noncache]
    attributes: [w]

module_class_rules:
  Networking: [lwip, tcp, udp, ip4, eth, mqtt, dhcp, dns, sntp, smtp, tftp, socket, arp, netbios]
  Drivers / BSP: [xil, xemac, xadc, qspi, sdps, ttc, scugic, uart, iic, gpio, bsp, driver, phy, stm32, hal, fsl_, lpc_, kinetis, mcux, atmel_, sam_, pic_, avr_, em_, sl_, r_, rz_, cy_, xmc_]
  File system: [fatfs, ff., ff_, xilffs, diskio, filesystem, file]
  RTOS: [freertos, free_rtos, task, queue, semphr, event_group, stream_buffer, cmsis, arm_, zephyr, rtthread, rt_thread, threadx, azure_rtos, tx_, nx_, gx_, ux_, ucos, micrium, os_cfg, os_task, nuttx, vxworks, vx_, mbed, ti_rtos, sysbios, bios, chibios, ch_, contiki, rtems, rtx, cmsis_rtos, pico_sdk, pico_, esp_rtos, esp_task, harmony]
  DSP: [dsp, fir, iir, fft, filter, arm_cfir, arm_fir, arm_iir, arm_fft, arm_math]
  Runtime / C library: [libc, glibc, musl, newlib, uclibc, ulibc, picolibc, avr-libc, klibc, dietlibc, bionic, arm_none_eabi, libm, libstdc, libcxx, libgcc, compiler-rt, crt, crtbegin, crtend, malloc, printf, memcpy, strlen, strcpy]
  Application: [app, cli, handler, manager, database, fota, ota]
  Libraries / middleware: [".a(", ".lib("]
